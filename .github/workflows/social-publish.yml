name: Social Publish

on:
  push:
    branches: [main]
    paths:
      - "social/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse only — skip X/LinkedIn API calls"
        type: boolean
        default: false
      file:
        description: "Optional single file under social/ (e.g. social/my-post.md)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify social API credentials
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run — skipping credential check"
            exit 0
          fi
          missing=0
          for var in X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET LINKEDIN_ACCESS_TOKEN LINKEDIN_AUTHOR_URN; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "::warning::Missing secret $var — that channel will fail"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -eq 6 ]; then
            echo "::error::Add X and LinkedIn secrets (see social/README.md)"
            exit 1
          fi

      - name: Publish social posts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_VERSION: ${{ secrets.LINKEDIN_API_VERSION }}
          NEXT_PUBLIC_SITE_URL: https://ilakk-manoharan.vercel.app
          SOCIAL_DRY_RUN: ${{ github.event.inputs.dry_run == true && '1' || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            npx tsx scripts/social-publish/publish.ts --file "${{ github.event.inputs.file }}"
          else
            npx tsx scripts/social-publish/publish.ts --from-git-diff
          fi

      - name: Commit site feed updates
        run: |
          git config user.name "social-publish-agent"
          git config user.email "social-publish-agent@users.noreply.github.com"
          git add content/social/posts.json
          if git diff --staged --quiet; then
            echo "No feed changes to commit"
            exit 0
          fi
          git commit -m "Social: publish feed update"
          git push
