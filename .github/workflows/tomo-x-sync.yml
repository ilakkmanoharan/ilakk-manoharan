name: Sync TOMO posts from X

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tomo-x-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOMO_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Import and save TOMO posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TOMO_COMMIT_EMAIL: ${{ vars.TOMO_COMMIT_EMAIL }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "::notice::Set the X_BEARER_TOKEN repository secret to enable TOMO sync."
            exit 0
          fi
          node scripts/sync-tomo-x.mjs
          git add -- content/tomo-posts.json
          if [ -f content/tomo-x-cursor.json ]; then git add -- content/tomo-x-cursor.json; fi
          if [ -d public/tomo/x ]; then git add -- public/tomo/x; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "TOMO archive"
          git config user.email "${TOMO_COMMIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git commit -m "Sync TOMO archive from X"
          git push
