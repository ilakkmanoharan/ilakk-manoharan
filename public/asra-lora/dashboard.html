    const palette = ["#5eead4","#818cf8","#f472b6","#fbbf24","#34d399","#60a5fa","#fb7185","#a78bfa"];
    function kpi(label, value) {
      const el = document.createElement("div");
      el.className = "kpi";
      el.innerHTML = `<div class="n">${value}</div><div class="l">${label}</div>`;
      return el;
    }
    const kpis = document.getElementById("kpis");
    const manifest = STATS.manifest || {};
    const totalRows = Object.values(manifest).reduce((s, m) => s + (m.rows || 0), 0);
    kpis.appendChild(kpi("Total rows", totalRows.toLocaleString()));
    kpis.appendChild(kpi("Datasets", Object.keys(manifest).length));
    kpis.appendChild(kpi("Largest", "D1 · 81k"));
    function addCard(title, subtitle, canvasId) {
      const card = document.createElement("section");
      card.className = "card";
      card.innerHTML = `<h2>${title}</h2><p>${subtitle}</p><canvas id="${canvasId}"></canvas>`;
      document.getElementById("charts").appendChild(card);
      return document.getElementById(canvasId);
    }
    function barChart(canvas, labels, values, label) {
      new Chart(canvas, { type: "bar", data: { labels, datasets: [{ label, data: values, backgroundColor: "#5eead499" }] },
        options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#8fa3c8" } }, y: { ticks: { color: "#8fa3c8" } } } } });
    }
    function doughnut(canvas, labels, values) {
      new Chart(canvas, { type: "doughnut", data: { labels, datasets: [{ data: values, backgroundColor: palette }] },
        options: { plugins: { legend: { position: "bottom", labels: { color: "#e8eefc" } } } } });
    }
    const d1 = STATS.datasets["1_action_effect"];
    doughnut(addCard("D1 · Action effects", "Class balance", "c1"), Object.keys(d1.effects), Object.values(d1.effects));
    barChart(addCard("D1 · Changed cells", "Cell diff distribution", "c1h"), d1.changed_cells_hist.labels.slice(0,12), d1.changed_cells_hist.counts.slice(0,12), "count");
    const d2 = STATS.datasets["2_next_action"];
    barChart(addCard("D2 · Next actions", "Action labels", "c2"), Object.keys(d2.actions), Object.values(d2.actions), "rows");
    const d3 = STATS.datasets["3_failure_revision"];
    doughnut(addCard("D3 · Failure types", "FailureLoRA drivers", "c3"), Object.keys(d3.effect_types), Object.values(d3.effect_types));
    const d4 = STATS.datasets["4_submit_postmortem"];
    barChart(addCard("D4 · Kaggle scores", "By phase", "c4"), d4.phases, d4.scores, "score");
    const d7 = STATS.datasets["7_trace_trajectory"];
    doughnut(addCard("D7 · Trace domains", "ASRA vs ARC", "c7"), Object.keys(d7.domains), Object.values(d7.domains));
