<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">ASRA-NFM architecture flow</title>
  <desc id="desc">Observation to object-centric perception, structured state, intervention, transition analysis, hypotheses, hybrid world model, uncertainty, planning, next action, with feedback to memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="gNeural" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/><stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="gSymbolic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gMem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b21a8"/><stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="16" fill="#0b1220"/>

  <!-- Legend -->
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="24" y="16" width="12" height="12" rx="3" fill="url(#gNeural)"/>
    <text x="42" y="26">Neural / perception</text>
    <rect x="180" y="16" width="12" height="12" rx="3" fill="url(#gSymbolic)"/>
    <text x="198" y="26">Symbolic hypotheses</text>
    <rect x="360" y="16" width="12" height="12" rx="3" fill="url(#gMem)"/>
    <text x="378" y="26">Memory / evidence</text>
    <rect x="520" y="16" width="12" height="12" rx="3" fill="url(#gPlan)"/>
    <text x="538" y="26">Planning / decision</text>
  </g>

  <!-- Boxes row 1 -->
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">
    <rect x="30" y="56" width="150" height="48" rx="10" fill="url(#gNeural)" stroke="#22d3ee" stroke-width="1"/>
    <text x="105" y="85">Raw Observation</text>

    <rect x="220" y="56" width="170" height="48" rx="10" fill="url(#gNeural)" stroke="#22d3ee" stroke-width="1"/>
    <text x="305" y="78">Object-Centric</text>
    <text x="305" y="94">Perception</text>

    <rect x="430" y="56" width="150" height="48" rx="10" fill="url(#gNeural)" stroke="#22d3ee" stroke-width="1"/>
    <text x="505" y="85">Structured State</text>

    <rect x="620" y="56" width="150" height="48" rx="10" fill="url(#gPlan)" stroke="#c084fc" stroke-width="1"/>
    <text x="695" y="78">Action /</text>
    <text x="695" y="94">Intervention</text>

    <rect x="810" y="56" width="80" height="48" rx="10" fill="url(#gMem)" stroke="#34d399" stroke-width="1"/>
    <text x="850" y="85">”_t</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="80" x2="216" y2="80"/>
    <line x1="390" y1="80" x2="426" y2="80"/>
    <line x1="580" y1="80" x2="616" y2="80"/>
    <line x1="770" y1="80" x2="806" y2="80"/>
  </g>

  <!-- Row 2 -->
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">
    <rect x="80" y="150" width="180" height="52" rx="10" fill="url(#gMem)" stroke="#34d399" stroke-width="1"/>
    <text x="170" y="172">Transition Analysis</text>
    <text x="170" y="188">T=(s,a,s2) · Diff</text>

    <rect x="300" y="150" width="200" height="52" rx="10" fill="url(#gSymbolic)" stroke="#fbbf24" stroke-width="1"/>
    <text x="400" y="172">Competing Symbolic</text>
    <text x="400" y="188">Hypotheses H_t</text>

    <rect x="540" y="150" width="200" height="52" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
    <text x="640" y="168" fill="#22d3ee">Neural</text>
    <text x="640" y="184" fill="#fbbf24">+ Symbolic World Model</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M850,104 L850,130 L260,130 L260,148"/>
    <line x1="260" y1="176" x2="296" y2="176"/>
    <line x1="500" y1="176" x2="536" y2="176"/>
  </g>

  <!-- Row 3 -->
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">
    <rect x="160" y="250" width="200" height="52" rx="10" fill="url(#gPlan)" stroke="#c084fc" stroke-width="1"/>
    <text x="260" y="272">Uncertainty &amp;</text>
    <text x="260" y="288">Information Gain</text>

    <rect x="400" y="250" width="240" height="52" rx="10" fill="url(#gPlan)" stroke="#c084fc" stroke-width="1"/>
    <text x="520" y="272">Experiment Selection or</text>
    <text x="520" y="288">Goal-Directed Planning</text>

    <rect x="680" y="250" width="140" height="52" rx="10" fill="url(#gPlan)" stroke="#c084fc" stroke-width="1"/>
    <text x="750" y="280">Next Action</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M640,202 L640,230 L360,230 L360,248"/>
    <line x1="360" y1="276" x2="396" y2="276"/>
    <line x1="640" y1="276" x2="676" y2="276"/>
  </g>

  <!-- Feedback -->
  <g stroke="#34d399" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)">
    <path d="M750,302 L750,360 L105,360 L105,104"/>
  </g>
  <text x="430" y="390" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12" fill="#34d399">
    Feedback: next observation ’ memory update ’ hypothesis revision
  </text>

  <!-- Agents strip -->
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">
    <rect x="30" y="318" width="90" height="28" rx="8" fill="#164e63" stroke="#22d3ee"/>
    <text x="75" y="336" text-anchor="middle" fill="#a5f3fc">Tabby</text>
    <rect x="130" y="318" width="90" height="28" rx="8" fill="#064e3b" stroke="#34d399"/>
    <text x="175" y="336" text-anchor="middle" fill="#a7f3d0">Grubby</text>
    <rect x="230" y="318" width="90" height="28" rx="8" fill="#581c87" stroke="#c084fc"/>
    <text x="275" y="336" text-anchor="middle" fill="#e9d5ff">Sam</text>
  </g>
</svg>
