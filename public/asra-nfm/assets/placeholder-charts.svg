<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="ctitle">
  <title id="ctitle">Placeholder evaluation charts  replace with measured data</title>
  <rect width="640" height="280" rx="12" fill="#121a2b"/>
  <text x="20" y="28" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#f1f5f9" font-weight="600">
    Evaluation placeholders (no fabricated measurements)
  </text>
  <text x="20" y="48" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#94a3b8">
    Replace bars when [SCORE], ablations, and N are supplied.
  </text>

  <!-- Left: method comparison placeholder -->
  <text x="20" y="78" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#22d3ee">Methods (placeholder axis)</text>
  <g font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#94a3b8">
    <text x="20" y="108">Random</text>
    <rect x="100" y="96" width="40" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="148" y="108" fill="#64748b">[ ]</text>

    <text x="20" y="132">Heuristic</text>
    <rect x="100" y="120" width="55" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="163" y="132" fill="#64748b">[ ]</text>

    <text x="20" y="156">Neural-only</text>
    <rect x="100" y="144" width="70" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="178" y="156" fill="#64748b">[ ]</text>

    <text x="20" y="180">Symbolic-only</text>
    <rect x="100" y="168" width="65" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="173" y="180" fill="#64748b">[ ]</text>

    <text x="20" y="204">Hybrid</text>
    <rect x="100" y="192" width="90" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="198" y="204" fill="#64748b">[ ]</text>

    <text x="20" y="228">Hybrid + active IG</text>
    <rect x="100" y="216" width="110" height="14" rx="3" fill="#164e63" stroke="#22d3ee" stroke-dasharray="3 2"/>
    <text x="218" y="228" fill="#22d3ee">[SCORE]</text>
  </g>

  <!-- Right: ablation placeholders -->
  <text x="340" y="78" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#fbbf24">Ablations (placeholder)</text>
  <g font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#94a3b8">
    <text x="340" y="108"> object relations</text>
    <rect x="490" y="96" width="50" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="340" y="132"> hypothesis memory</text>
    <rect x="490" y="120" width="50" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="340" y="156"> neural world model</text>
    <rect x="490" y="144" width="50" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="340" y="180"> active experiment</text>
    <rect x="490" y="168" width="50" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="340" y="204"> failure memory</text>
    <rect x="490" y="192" width="50" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="340" y="228"> complexity penalty</text>
    <rect x="490" y="216" width="50" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-dasharray="3 2"/>
  </g>

  <text x="20" y="262" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" font-style="italic">
    Fig. Charts  editable SVG; dashed bars indicate missing measured values. Do not treat as empirical results.
  </text>
</svg>
